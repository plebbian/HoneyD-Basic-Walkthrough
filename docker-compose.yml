services:
  honeyd:
    profiles: ["linux"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile

    container_name: honeyd-linux
    network_mode: host
    privileged: true

    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      HONEYD_INTERFACE: lo
      HONEYD_CONFIG: /opt/honeyd/honeyd.conf
      HONEYD_NET: 192.168.0.0/24
      HONEYD_GW: 127.0.0.1
      HONEYD_BIN: /usr/bin/honeyd

    volumes:
      - ./infra/config/honeyd.conf:/opt/honeyd/honeyd.conf:ro
      - ./scripts:/opt/honeyd/scripts:ro

    restart: unless-stopped

  honeyd-compat:
    profiles: ["compat"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile

    container_name: honeyd-compat
    privileged: true

    cap_add:
      - NET_ADMIN
      - NET_RAW

    ports:
      - "102:102"
  gui:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: honeyd-gui
    ports:
      - "5000:5000"
    working_dir: /opt/honeyd
    command: python3 app.py

    environment:
      HONEYD_INTERFACE: eth0
      HONEYD_CONFIG: /opt/honeyd/honeyd.conf
      HONEYD_NET: 192.168.0.0/24
      HONEYD_GW: 127.0.0.1
      HONEYD_BIN: /usr/bin/honeyd

    volumes:
      - ./infra/config/honeyd.conf:/opt/honeyd/honeyd.conf:ro
      - ./scripts:/opt/honeyd/scripts:ro
      - ./gui/app.py:/opt/honeyd/app.py
      - ./gui/templates:/opt/honeyd/templates
      - ./gui/static:/opt/honeyd/static
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped