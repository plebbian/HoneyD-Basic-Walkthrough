<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF=8">
	<title>About The Project</title>
	<link rel="stylesheet" href="/">
<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
}

header {
    background: #8C0B42;
    color: white;
    padding: 15px;
    text-align: center;
}

img {
    position: absolute;
    top: 0;
    left: 0;
}

main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
}

.panel {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0,.1);
}

pre {
    background: #111;
    color: #0f0;
    padding: 10px;
    height: 250px;
    overflow-y: scroll;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    margin-right: 10px;
    cursor: pointer;
    border: none;
    background: #009DB8;
    color: white;
    border-radius: 5px;
}
</style>
</head>
<body>
	<header>
		<h1><img class="logo" img src="images/NM_State_University_logo.png" alt="New Mexico State University Logo" width="90" height="90" title="NMSU" /> HoneyD Documentation</h1>
	</header>

	<main>
		<section class="panel">
			<h2>Mini wiki coming soon...</h2>
			<div id="docs">yipee this works</div>
		</section>
        <button onclick="location.href='index.html'">go back</button>
	</main>
	<script src="app.js"></script>
</body>
</html>
